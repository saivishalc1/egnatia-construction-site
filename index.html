<!doctype html>
<html lang="en" data-palette="cinema">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egnatia Construction | General Contractor in Brooklyn, NY</title>
    <meta name="description" content="Egnatia Construction Inc. is a licensed Brooklyn general contractor for whole-home renovations, brownstones, additions and custom homes across New York City. Projects from $150K. Free on-site estimates." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Egnatia Construction | Built in Brooklyn. Built to last." />
    <meta property="og:description" content="Whole-home renovations, brownstones and custom homes across New York City. Projects from $150K." />
    <meta property="og:image" content="%BASE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "Egnatia Construction Inc.",
        "description": "Whole-home renovations, brownstones, additions and custom homes across New York City.",
        "email": "info@egnatiaconstruction.com",
        "telephone": ["+1-718-581-3386", "+1-212-392-5544"],
        "address": { "@type": "PostalAddress", "addressLocality": "Brooklyn", "addressRegion": "NY", "addressCountry": "US" },
        "areaServed": "New York City",
        "knowsLanguage": ["en", "es"],
        "priceRange": "$150,000+"
      }
    </script>
    <meta name="theme-color" content="#0b0a09" />
    <!-- Draft preview: keep out of search results until the client approves launch. Remove at launch. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <!-- Painted instantly, before any JavaScript: the hero poster under the same dark scrim.
         React replaces it on mount with the real hero, which uses the same image. -->
    <div id="root">
      <div style="position:fixed;inset:0;background:#0c0b0a">
        <img
          src="%BASE_URL%videos/hero-poster-1920.webp"
          srcset="%BASE_URL%videos/hero-poster-960.webp 960w, %BASE_URL%videos/hero-poster-1920.webp 1920w"
          sizes="100vw"
          alt=""
          fetchpriority="high"
          style="width:100%;height:100%;object-fit:cover;transform:scale(1.08)"
        />
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,10,.65) 0%,rgba(12,11,10,.25) 35%,rgba(12,11,10,.75) 75%,#0c0b0a 100%)"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
